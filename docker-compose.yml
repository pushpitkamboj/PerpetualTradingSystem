services:
  postgres:
    image: postgres:17
    container_name: python_cex_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: python_cex_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
  
  fastapi:
    build:
      context: .
      dockerfile: app/services/backend_service/Dockerfile
    env_file:
      - .env
    environment:
      REDIS_SERVER_URL: redis://redis:6379
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-sqlite+aiosqlite:////data/python_perps.db}
    depends_on:
      - redis
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - db_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  binance:
    build:
      context: .
      dockerfile: app/services/binance_service/Dockerfile
    env_file:
      - .env
    environment:
      REDIS_SERVER_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  orderbook:
    build:
      context: .
      dockerfile: app/services/order_book_service/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-sqlite+aiosqlite:////data/python_perps.db}
    depends_on:
      redis:
        condition: service_started
      fastapi:
        condition: service_healthy
    network_mode: "service:redis"
    volumes:
      - db_data:/data
    restart: unless-stopped

  db_ingestor:
    build:
      context: .
      dockerfile: app/services/db_ingestor_service/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-sqlite+aiosqlite:////data/python_perps.db}
    depends_on:
      redis:
        condition: service_started
      fastapi:
        condition: service_healthy
    network_mode: "service:redis"
    volumes:
      - db_data:/data
    restart: unless-stopped

  liquidity_bot:
    build:
      context: .
      dockerfile: app/services/bot_service/Dockerfile
    env_file:
      - .env
    environment:
      BOT_API_BASE_URL: http://fastapi:8000
      BOT_WS_BASE_URL: ws://fastapi:8000
      BOT_COUNT: ${BOT_COUNT:-10}
      BOT_STARTING_BALANCE: ${BOT_STARTING_BALANCE:-5000}
      BOT_MIN_SLEEP_SECONDS: ${BOT_MIN_SLEEP_SECONDS:-1.5}
      BOT_MAX_SLEEP_SECONDS: ${BOT_MAX_SLEEP_SECONDS:-7}
    depends_on:
      fastapi:
        condition: service_healthy
      orderbook:
        condition: service_started
      db_ingestor:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  db_data:
