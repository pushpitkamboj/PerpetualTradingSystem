# Hostinger Docker Manager currently pulls images and starts Compose projects;
# it does not build the Dockerfiles in this repository. Follow the deployed
# aidataanalyst pattern: clone the source once, then install each service's
# requirements and run that service in its own Python container.
x-repository: &repository
  GIT_REPOSITORY: https://github.com/pushpitkamboj/PerpetualTradingSystem.git
  GIT_BRANCH: perps-hostinger-deploy-20261112

services:
  source_sync:
    image: alpine/git:2.47.2
    restart: "no"
    environment: *repository
    volumes:
      - source_data:/src
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -d /src/.git ]; then
          git -C /src fetch --depth 1 origin "$${GIT_BRANCH}"
          git -C /src reset --hard FETCH_HEAD
        else
          find /src -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git clone --depth 1 --branch "$${GIT_BRANCH}" "$${GIT_REPOSITORY}" /src
        fi

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  fastapi:
    image: python:3.13-slim
    restart: unless-stopped
    working_dir: /src/app/services/backend_service
    command: >
      sh -ec 'pip install --no-cache-dir -r requirements.txt &&
      exec uvicorn app:app --host 0.0.0.0 --port 8000'
    environment:
      PYTHONPATH: /src/app
      REDIS_SERVER_URL: redis://redis:6379
      DATABASE_URL: sqlite+aiosqlite:////data/python_perps.db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the Hostinger project environment}
      DEMO_WALLET_BALANCE: ${DEMO_WALLET_BALANCE:-10000}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-https://perpetual-trading-system.pushpitkamboj.com}
      CORS_ALLOW_ORIGIN_REGEX: ""
    volumes:
      - source_data:/src:ro
      - db_data:/data
    expose:
      - "8000"
    networks:
      default: {}
      vps_proxy:
        aliases:
          - python-perps-fastapi
    depends_on:
      source_sync:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s

  binance:
    image: python:3.13-slim
    restart: unless-stopped
    working_dir: /src/app/services/binance_service
    command: >
      sh -ec 'pip install --no-cache-dir -r requirements.txt &&
      exec faststream run app:app'
    environment:
      PYTHONPATH: /src/app
      REDIS_SERVER_URL: redis://redis:6379
      BINANCE_REST_URL: https://data-api.binance.vision/api/v3/ticker/price?symbols=%5B%22BTCUSDT%22,%22ETHUSDT%22%5D
    volumes:
      - source_data:/src:ro
    depends_on:
      source_sync:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  orderbook:
    image: python:3.13-slim
    restart: unless-stopped
    working_dir: /src/app/services/order_book_service
    command: >
      sh -ec 'pip install --no-cache-dir -r requirements.txt &&
      exec faststream run app:app'
    environment:
      PYTHONPATH: /src/app
      DATABASE_URL: sqlite+aiosqlite:////data/python_perps.db
    volumes:
      - source_data:/src:ro
      - db_data:/data
    depends_on:
      source_sync:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    network_mode: service:redis
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from redis import Redis; assert Redis.from_url('redis://localhost:6379', socket_connect_timeout=2).xinfo_groups('perps')
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  db_ingestor:
    image: python:3.13-slim
    restart: unless-stopped
    working_dir: /src/app/services/db_ingestor_service
    command: >
      sh -ec 'pip install --no-cache-dir -r requirements.txt &&
      exec faststream run app:app'
    environment:
      PYTHONPATH: /src/app
      DATABASE_URL: sqlite+aiosqlite:////data/python_perps.db
    volumes:
      - source_data:/src:ro
      - db_data:/data
    depends_on:
      source_sync:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    network_mode: service:redis
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from redis import Redis; assert Redis.from_url('redis://localhost:6379', socket_connect_timeout=2).xinfo_groups('perps_updates')
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  liquidity_bot:
    image: python:3.13-slim
    restart: unless-stopped
    working_dir: /src/app
    command: >
      sh -ec 'pip install --no-cache-dir -r services/bot_service/requirements.txt &&
      exec python -m packages.liquidity_bot'
    environment:
      PYTHONPATH: /src/app
      BOT_API_BASE_URL: http://fastapi:8000
      BOT_WS_BASE_URL: ws://fastapi:8000
      BOT_COUNT: ${BOT_COUNT:-5}
      BOT_STARTING_BALANCE: ${BOT_STARTING_BALANCE:-5000}
      BOT_MIN_SLEEP_SECONDS: ${BOT_MIN_SLEEP_SECONDS:-1.5}
      BOT_MAX_SLEEP_SECONDS: ${BOT_MAX_SLEEP_SECONDS:-7}
    volumes:
      - source_data:/src:ro
    depends_on:
      source_sync:
        condition: service_completed_successfully
      fastapi:
        condition: service_healthy
      orderbook:
        condition: service_healthy
      db_ingestor:
        condition: service_healthy

volumes:
  source_data:
  redis_data:
  db_data:

networks:
  vps_proxy:
    name: vps_proxy
    external: true
