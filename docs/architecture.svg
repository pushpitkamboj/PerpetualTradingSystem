<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Python Perps architecture</title>
  <desc id="desc">Architecture diagram showing users, backend, Redis input and output streams, Binance service, order book service, database ingestor, Postgres database, and S3 snapshots.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d92d20"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #1f2933; stroke-width: 4; }
      .red-box { fill: #fff; stroke: #d92d20; stroke-width: 4; }
      .label { fill: #111827; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 28px; font-weight: 700; text-anchor: middle; }
      .small { fill: #111827; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 20px; font-weight: 600; }
      .tiny { fill: #111827; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; }
      .red { fill: #d92d20; }
      .line { fill: none; stroke: #1f2933; stroke-width: 4; marker-end: url(#arrow); }
      .line-no-arrow { fill: none; stroke: #1f2933; stroke-width: 4; }
      .red-line { fill: none; stroke: #d92d20; stroke-width: 4; marker-end: url(#red-arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <rect class="box" x="735" y="45" width="220" height="60" rx="14"/>
  <text class="label" x="845" y="84">USER</text>

  <rect class="box" x="745" y="210" width="220" height="150" rx="18"/>
  <text class="label" x="855" y="295">BACKEND</text>

  <rect class="box" x="85" y="210" width="185" height="165" rx="18"/>
  <text class="label" x="178" y="300">Postgres DB</text>

  <rect class="box" x="45" y="560" width="260" height="150" rx="18"/>
  <text class="label" x="175" y="625">DB INGESTOR</text>
  <text class="label" x="175" y="660">SERVICE</text>

  <rect class="box" x="520" y="555" width="210" height="125" rx="18"/>
  <text class="label" x="625" y="615">PERPS O/P</text>
  <text class="label" x="625" y="650">STREAM</text>

  <rect class="box" x="825" y="550" width="220" height="130" rx="18"/>
  <text class="label" x="935" y="610">PERPS I/P</text>
  <text class="label" x="935" y="645">STREAM</text>

  <rect class="box" x="770" y="760" width="330" height="110" rx="18"/>
  <text class="label" x="935" y="815">ORDER BOOK</text>
  <text class="label" x="935" y="850">SERVICE</text>

  <rect class="box" x="1248" y="105" width="295" height="85" rx="16"/>
  <text class="label" x="1395" y="158">BINANCE SERVER</text>

  <rect class="box" x="1175" y="315" width="160" height="105" rx="16"/>
  <text class="small" x="1215" y="365">BINANCE</text>
  <text class="small" x="1215" y="392">SERVICE</text>

  <rect class="red-box" x="1255" y="695" width="245" height="120" rx="18"/>
  <text class="label red" x="1378" y="750">S3</text>
  <text class="label red" x="1378" y="785">SNAPSHOTS</text>

  <line class="line" x1="790" y1="105" x2="790" y2="210"/>
  <text class="small" x="660" y="170">ws</text>
  <text class="small" x="635" y="195">pnl, liquidation,</text>
  <text class="small" x="635" y="220">index price,</text>
  <text class="small" x="635" y="245">order book</text>

  <line class="line" x1="895" y1="105" x2="895" y2="210"/>
  <text class="small" x="940" y="158">https</text>
  <text class="small" x="940" y="185">create order</text>
  <text class="small" x="940" y="212">get balance</text>
  <text class="small" x="940" y="239">close position</text>

  <line class="line-no-arrow" x1="270" y1="290" x2="745" y2="290"/>
  <text class="small" x="510" y="272">user details</text>
  <text class="small" x="510" y="300">and auth</text>

  <line class="line-no-arrow" x1="177" y1="375" x2="177" y2="560"/>
  <text class="small" x="210" y="455">orders</text>
  <text class="small" x="210" y="482">fills</text>
  <text class="small" x="210" y="509">balance</text>
  <text class="small" x="210" y="536">positions</text>

  <line class="line" x1="745" y1="355" x2="650" y2="555"/>
  <text class="small" x="610" y="455">everything</text>
  <text class="small" x="610" y="482">from engine</text>

  <line class="line" x1="520" y1="620" x2="305" y2="620"/>
  <text class="small" x="335" y="645">everything from</text>
  <text class="small" x="335" y="672">engine, except</text>
  <text class="small" x="335" y="699">orderbook</text>

  <line class="line" x1="855" y1="360" x2="855" y2="550"/>
  <text class="small" x="795" y="465">orders</text>

  <line class="line" x1="940" y1="550" x2="940" y2="360"/>
  <text class="small" x="970" y="465">index price</text>

  <line class="line" x1="1335" y1="165" x2="1282" y2="315"/>
  <text class="small" x="1228" y="280">ws listener</text>

  <line class="line" x1="1175" y1="382" x2="1045" y2="595"/>
  <line class="line" x1="935" y1="680" x2="935" y2="760"/>
  <text class="small" x="870" y="728">orders</text>

  <line class="line" x1="1015" y1="680" x2="1015" y2="760"/>
  <text class="small" x="1035" y="728">index price</text>

  <line class="line" x1="770" y1="765" x2="625" y2="680"/>
  <text class="small" x="600" y="755">positions</text>
  <text class="small" x="600" y="782">fills</text>
  <text class="small" x="600" y="809">close position</text>
  <text class="small" x="600" y="836">liquidation</text>
  <text class="small" x="600" y="863">orderbook updates</text>

  <line class="red-line" x1="1100" y1="805" x2="1255" y2="755"/>
  <text class="small red" x="1160" y="786">WIP</text>
</svg>
